# Portão de qualidade do monorepo.
#
# Existe porque as suítes já estavam escritas e nada as obrigava a passar: dava
# para empurrar código vermelho para a `main` e, pior, o APK saía assim mesmo e
# ia para os testadores. Aqui as duas pontas rodam a cada push e a cada PR, e a
# distribuição só acontece depois disto (ver distribute.yml).
#
# A RAIZ importa: o GitHub Actions só lê `.github/workflows` da raiz do
# repositório. Este arquivo já esteve em `app/.github/workflows/`, herdado de
# quando o app era um repositório próprio — lá ele nunca foi executado.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Push atrás de push na mesma branch: o build anterior é cancelado em vez de
# disputar runner com o novo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    # O BANCO DO CI.
    #
    # A API deixou de falar com um arquivo SQLite e passou a falar com um
    # Postgres, e o runner não tem um. Sem este serviço o `prisma generate`
    # morria na primeira linha (`prisma.config.ts` exige DATABASE_URL) e o
    # portão inteiro caía ANTES de rodar lint, build ou teste algum — vermelho
    # desde a migração, com o `distribute.yml` pulando por consequência.
    # A VERSÃO acompanha a de produção (Neon, Postgres 18), e é nessa direção
    # que ela deve ser mantida. O ambiente de teste nasceu no 18 e o CI estava
    # no 16: a saída certa para essa diferença é subir o portão até onde o
    # sistema roda de verdade, não rebaixar o servidor até onde o portão está —
    # testar numa versão que ninguém usa não prova nada sobre a que todo mundo
    # usa. Trocando o banco de produção um dia, esta linha muda junto.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: barter_test
        ports:
          - 5432:5432
        # Sem isto os passos começam antes de o Postgres aceitar conexão, e a
        # falha aparece como "connection refused" intermitente.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # No NÍVEL DO JOB de propósito: os quatro passos abaixo precisam da variável
    # (`prisma generate`, `build`, `test` e `test:e2e`). O `.env.test` continua
    # valendo para o resto — PASSWORD_COST, os limites de requisição —, porque o
    # dotenv-cli NÃO sobrepõe variável que já existe no ambiente. É o que deixa
    # a suíte usar o Postgres do runner aqui e o banco local na máquina de quem
    # desenvolve, com o mesmo arquivo.
    #
    # A precedência completa, do mais forte para o mais fraco: esta variável de
    # job → `.env.test.local` (o de cada máquina, não versionado) → `.env.test`
    # (o padrão versionado). Aqui só a primeira existe, e é a que vale.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/barter_test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci

      # O client tipado não é versionado: sem gerar, nada compila.
      - name: Gerar o Prisma Client
        run: npx prisma generate

      # Sem `--fix`: no CI o lint precisa REPROVAR, não consertar em silêncio um
      # arquivo que ninguém vai commitar (o script `npm run lint` conserta, e é
      # isso que se quer na máquina de quem escreve).
      #
      # `prisma/` e `scripts/` entram na lista porque é onde moram o
      # provisionamento do primeiro admin e a redefinição de senha pela linha de
      # comando — código de segurança que estava fora do portão.
      - name: Lint
        run: npx eslint "src/**/*.ts" "test/**/*.ts" "prisma/**/*.ts" "scripts/**/*.ts"

      - name: Compilar (o que o tsc pega e o jest não)
        run: npm run build

      # AS DUAS SUÍTES numa execução só (jest `projects`), com cobertura.
      #
      # `test:cov` roda exatamente os mesmos testes que `npm test` e
      # `npm run test:e2e` rodam separadamente — só que instrumentados e de uma
      # vez. Rodar por aqui mantém os dois portões e ainda imprime o número real
      # de cobertura a cada build; rodar as suítes duas vezes (uma para gatear,
      # outra para medir) seria o dobro do tempo pelo mesmo resultado.
      #
      # E mantém a configuração de cobertura VIVA: enquanto ela existia só como
      # um script que ninguém chamava, o relatório podia apodrecer sem que nada
      # reclamasse — foi assim que ele passou a medir só a suíte de unidade
      # contra o código inteiro e a devolver 25%, quando o valor é 92%.
      #
      # `pretest:cov` aplica as migrations no Postgres do serviço acima.
      # `.env.test` é versionado de propósito: ele não guarda segredo nenhum, e
      # é o que dá à suíte os valores que ela precisa (PASSWORD_COST baixo, os
      # limites de requisição folgados). O DATABASE_URL dele vale na máquina de
      # quem desenvolve; aqui quem vale é o do job.
      - name: Testes (unidade + e2e, com cobertura)
        run: npm run test:cov

      # VARREDURA DE DEPENDÊNCIA — por último de propósito.
      #
      # É um portão de cadeia de suprimentos, não de corretude: um aviso
      # publicado durante a noite reprova o build sem que uma linha do projeto
      # tenha mudado. Rodando depois dos testes, esse dia ainda mostra o
      # resultado das suítes em vez de escondê-lo atrás de um alarme de
      # terceiro — e continua bloqueando a distribuição, que é o ponto.
      #
      # `--audit-level=high` porque o alarme precisa significar alguma coisa:
      # reprovar em `low` treina todo mundo a ignorar o passo. O que estiver
      # preso dentro de dependência alheia se resolve com `overrides` no
      # package.json, que é onde os de hoje estão documentados.
      - name: Auditoria de dependências
        run: npm audit --audit-level=high

  app:
    name: App (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # `dart format` fica de fora de propósito: o código de hoje segue outro
      # estilo de quebra de linha e exigi-lo aqui reprovaria 42 dos 47 arquivos
      # por formatação, não por defeito. `flutter analyze` é o portão que
      # encontra problema de verdade.
      - name: Análise estática
        run: flutter analyze

      - name: Testes
        run: flutter test
